assets:
  first_only: false
  checkpoints:
    GPT_S:
      repo_id: flwi/Physics-Foundation-Model
      filename: gphyt-S.pth
    GPT_M:
      repo_id: flwi/Physics-Foundation-Model
      filename: gphyt-M.pth
    GPT_L:
      repo_id: flwi/Physics-Foundation-Model
      filename: gphyt-L.pth
    GPT_XL:
      repo_id: flwi/Physics-Foundation-Model
      filename: gphyt-XL.pth
  well_datasets:
    - shear_flow
    - rayleigh_benard
    - euler_multi_quadrants_periodicbc
    - turbulent_radiative_layer_2d

model:
  architecture: gphyt
  transformer:
    input_channels: 5
    model_size: GPT_S
    att_mode: full
    dropout: 0.0
    pos_enc_mode: absolute
    patch_size: [1, 16, 16]
    stochastic_depth_rate: 0.0
    use_derivatives: true
    integrator: Euler
  tokenizer:
    tokenizer_mode: linear
    detokenizer_mode: linear
    tokenizer_overlap: 0
    detokenizer_overlap: 0

data:
  well_base_path: data
  data_dir: data/datasets
  datasets:
    - shear_flow
    - rayleigh_benard
  n_steps_input: 4
  n_steps_output: 4
  dt_stride: 1
  out_shape: [256, 128]
  use_normalization: true
  include_fields: null

steering:
  backend: auto
  device: cuda:0
  batch_size: 4
  max_batches: null
  model_sizes: [GPT_S, GPT_M, GPT_L, GPT_XL]
  top_k_layers: 3
  methods: [mean_diff, logistic, pca]
  scales: [-4, -2, -1, 0, 1, 2, 4]
  rollout_num_timesteps: 50
  rollout_num_samples: 4
  rollout_autoregressive: true
  gif_cases:
    - model_size: GPT_XL
      dataset: rayleigh_benard
      split: valid
      vector_path: artifacts/bootstrap/vectors/GPT_XL/mean_pressure/block_out:0-logistic.safetensors
      scale: 2
      traj_idx: 0
      num_timesteps: 20
      field: pressure
      fps: 3
      output_name: bootstrap_gpt_xl_rollout_pressure.gif
      title: GPT_XL rollout steering on Rayleigh-Benard
    - model_size: GPT_XL
      dataset: rayleigh_benard
      split: valid
      vector_path: artifacts/bootstrap/vectors/GPT_XL/mean_pressure/block_out:0-logistic.safetensors
      scale: 2
      traj_idx: 0
      num_timesteps: 20
      field: velocity_magnitude
      fps: 3
      output_name: bootstrap_gpt_xl_rollout_velocity.gif
      title: GPT_XL rollout steering on Rayleigh-Benard
    - model_size: GPT_XL
      dataset: rayleigh_benard
      split: valid
      vector_path: artifacts/bootstrap/vectors/GPT_XL/mean_pressure/block_out:0-logistic.safetensors
      scale: -2
      traj_idx: 0
      num_timesteps: 20
      field: pressure
      fps: 3
      output_name: bootstrap_gpt_xl_rollout_pressure_neg.gif
      title: GPT_XL negative rollout steering on Rayleigh-Benard
    - model_size: GPT_XL
      dataset: rayleigh_benard
      split: valid
      vector_path: artifacts/bootstrap/vectors/GPT_XL/mean_pressure/block_out:0-logistic.safetensors
      scale: -2
      traj_idx: 0
      num_timesteps: 20
      field: velocity_magnitude
      fps: 3
      output_name: bootstrap_gpt_xl_rollout_velocity_neg.gif
      title: GPT_XL negative rollout steering on Rayleigh-Benard
    - model_size: GPT_XL
      dataset: rayleigh_benard
      split: valid
      vector_path: artifacts/bootstrap/xl_multitask/vectors/mean_velocity_magnitude/block_out:0-logistic.safetensors
      scale: -4
      traj_idx: 0
      num_timesteps: 20
      field: velocity_magnitude
      fps: 3
      output_name: bootstrap_gpt_xl_mean_velocity_rollout.gif
      title: GPT_XL mean-velocity steering on Rayleigh-Benard
    - model_size: GPT_XL
      dataset: rayleigh_benard
      split: valid
      vector_path: artifacts/bootstrap/xl_multitask/vectors/mean_velocity_magnitude/block_out:0-logistic.safetensors
      scale: -4
      traj_idx: 0
      num_timesteps: 20
      field: pressure
      fps: 3
      output_name: bootstrap_gpt_xl_mean_velocity_pressure.gif
      title: GPT_XL mean-velocity steering viewed in pressure
    - model_size: GPT_XL
      dataset: shear_flow
      split: valid
      vector_path: artifacts/bootstrap/xl_multitask/vectors/regime_shear_vs_rayleigh/block_out:0-logistic.safetensors
      scale: -4
      traj_idx: 0
      num_timesteps: 20
      field: velocity_magnitude
      fps: 3
      output_name: bootstrap_gpt_xl_regime_shear_velocity.gif
      title: GPT_XL regime steering on Shear Flow
    - model_size: GPT_XL
      dataset: shear_flow
      split: valid
      vector_path: artifacts/bootstrap/xl_multitask/vectors/regime_shear_vs_rayleigh/block_out:0-logistic.safetensors
      scale: 4
      traj_idx: 0
      num_timesteps: 20
      field: velocity_magnitude
      fps: 3
      output_name: bootstrap_gpt_xl_regime_shear_velocity_flip.gif
      title: GPT_XL reverse regime steering on Shear Flow
    - model_size: GPT_XL
      dataset: shear_flow
      split: valid
      vector_path: artifacts/bootstrap/xl_multitask/vectors/regime_shear_vs_rayleigh/block_out:0-logistic.safetensors
      scale: -4
      traj_idx: 0
      num_timesteps: 20
      field: pressure
      fps: 3
      output_name: bootstrap_gpt_xl_regime_shear_pressure.gif
      title: GPT_XL regime steering on Shear Flow viewed in pressure
    - model_size: GPT_XL
      dataset: rayleigh_benard
      split: valid
      vector_path: artifacts/bootstrap/xl_multitask/vectors/enstrophy_proxy/block_out:5-logistic.safetensors
      scale: 4
      traj_idx: 0
      num_timesteps: 20
      field: velocity_magnitude
      fps: 3
      output_name: bootstrap_gpt_xl_enstrophy_rollout.gif
      title: GPT_XL enstrophy steering on Rayleigh-Benard
    - model_size: GPT_S
      dataset: rayleigh_benard
      split: valid
      vector_path: artifacts/bootstrap/vectors/GPT_S/mean_pressure/block_out:0-logistic.safetensors
      scale: 2
      traj_idx: 0
      num_timesteps: 20
      field: pressure
      fps: 3
      output_name: bootstrap_gpt_s_rollout_pressure.gif
      title: GPT_S rollout steering on Rayleigh-Benard
    - model_size: GPT_S
      dataset: rayleigh_benard
      split: valid
      vector_path: artifacts/bootstrap/vectors/GPT_S/mean_pressure/block_out:0-logistic.safetensors
      scale: 2
      traj_idx: 0
      num_timesteps: 20
      field: velocity_magnitude
      fps: 3
      output_name: bootstrap_gpt_s_rollout_velocity.gif
      title: GPT_S rollout steering on Rayleigh-Benard
    - model_size: GPT_L
      dataset: rayleigh_benard
      split: valid
      vector_path: artifacts/bootstrap/vectors/GPT_L/mean_pressure/block_out:0-logistic.safetensors
      scale: -2
      traj_idx: 0
      num_timesteps: 20
      field: pressure
      fps: 3
      output_name: bootstrap_gpt_l_rollout_pressure_neg.gif
      title: GPT_L negative rollout steering on Rayleigh-Benard
    - model_size: GPT_M
      dataset: rayleigh_benard
      split: valid
      vector_path: artifacts/bootstrap/vectors/GPT_M/mean_pressure/block_out:0-logistic.safetensors
      scale: 2
      traj_idx: 0
      num_timesteps: 20
      field: pressure
      fps: 3
      output_name: bootstrap_gpt_m_rollout_pressure_failure.gif
      title: GPT_M counter-direction rollout steering on Rayleigh-Benard
    - model_size: GPT_S
      dataset: turbulent_radiative_layer_2d
      split: valid
      vector_path: artifacts/bootstrap/vectors/GPT_S/mean_pressure/block_out:0-logistic.safetensors
      scale: 2
      traj_idx: 0
      num_timesteps: 20
      field: pressure
      fps: 3
      output_name: bootstrap_gpt_s_transfer_pressure.gif
      title: GPT_S transfer steering on turbulent radiative layer
    - model_size: GPT_S
      dataset: turbulent_radiative_layer_2d
      split: valid
      vector_path: artifacts/bootstrap/vectors/GPT_S/mean_pressure/block_out:0-logistic.safetensors
      scale: 2
      traj_idx: 0
      num_timesteps: 20
      field: velocity_magnitude
      fps: 3
      output_name: bootstrap_gpt_s_transfer_velocity.gif
      title: GPT_S transfer steering on turbulent radiative layer
  default_target_feature: mean_velocity_magnitude
  task_ids:
    - regime_shear_vs_euler
    - regime_shear_vs_rayleigh
    - mean_velocity_magnitude
    - mean_pressure
    - enstrophy_proxy
  auxiliary_features:
    - mean_velocity_magnitude
    - mean_pressure
    - enstrophy_proxy

outputs:
  artifact_dir: artifacts
  activation_collection: artifacts/activations/train_collection.npz
  train_collection: artifacts/activations/train_collection.npz
  val_collection: artifacts/activations/val_collection.npz
  vector_dir: artifacts/vectors
  sweep_dir: artifacts/sweeps
  rollout_dir: artifacts/rollouts
  gif_dir: manuscript/generated/gifs
  combined_report: artifacts/reports/combined_report.csv
  remote_artifact_dir: gd:projects/physics-foundation-model-mechinterp
